<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Insights Tool</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img id="favicon" class="favicon" alt="" width="20" height="20" hidden>
    <div class="site">
      <div id="host" class="host">…</div>
      <div id="subhost" class="subhost"></div>
    </div>
    <button id="refresh" class="icon-btn" type="button" data-i18n-title="refresh" data-i18n-aria="refresh">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
    </button>
    <button id="settings" class="icon-btn" type="button" data-i18n-title="settings" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2.4h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.88a.5.5 0 0 0 .12.63l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.63l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.63l-2.03-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" class="tab" data-tab="overview" aria-selected="true" data-i18n="tab_overview"></button>
    <button role="tab" class="tab" data-tab="tech" aria-selected="false" data-i18n="tab_tech"></button>
    <button role="tab" class="tab" data-tab="seo" aria-selected="false" data-i18n="tab_seo"></button>
    <button role="tab" class="tab" data-tab="speed" aria-selected="false" data-i18n="tab_speed"></button>
  </nav>

  <main>
    <section id="panel-overview" class="panel" role="tabpanel"></section>
    <section id="panel-tech" class="panel" role="tabpanel" hidden></section>
    <section id="panel-seo" class="panel" role="tabpanel" hidden></section>
    <section id="panel-speed" class="panel" role="tabpanel" hidden></section>
  </main>

  <footer class="foot">
    <span data-i18n="footer_sources"></span>
    <a id="privacy-link" href="#" data-i18n="privacy"></a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
